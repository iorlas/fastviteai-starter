# Dagster Instance Configuration
# This file configures the Dagster instance for production deployment with PostgreSQL

# Storage for pipeline run history and metadata
run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOST
      db_name:
        env: POSTGRES_DB
      port:
        env: POSTGRES_PORT

# Storage for event logs (asset materializations, observations, etc.)
event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOST
      db_name:
        env: POSTGRES_DB
      port:
        env: POSTGRES_PORT

# Storage for schedules and sensors
schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOST
      db_name:
        env: POSTGRES_DB
      port:
        env: POSTGRES_PORT

# Compute log storage (stdout/stderr from runs)
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /app/.dagster/storage/compute_logs

# Run launcher configuration
# LocalRunLauncher runs jobs in the same process (suitable for development and single-container deployments)
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Telemetry (set to false if privacy is a concern)
telemetry:
  enabled: false
