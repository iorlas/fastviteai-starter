services:
  # PostgreSQL 16 Database Service (Dagster storage backend)
  dagster-postgresql:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagster}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    volumes:
      - dagster-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dagster}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Dagster Webserver (UI + GraphQL API)
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      # Application configuration
      ARTIFACTS_PATH: /app/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-mistralai/mistral-medium-3.1}
      ENABLE_SUMMARIZATION: ${ENABLE_SUMMARIZATION:-false}

      # PostgreSQL configuration (for Dagster storage)
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagster}
      POSTGRES_HOST: dagster-postgresql
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
      POSTGRES_PORT: 5432
    volumes:
      # Bind mount for artifacts directory (persistent data storage)
      - ./artifacts:/app/artifacts
    depends_on:
      dagster-postgresql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Dagster Daemon (schedules, sensors, run launcher)
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: daemon
    environment:
      # Application configuration
      ARTIFACTS_PATH: /app/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o}
      ENABLE_SUMMARIZATION: ${ENABLE_SUMMARIZATION:-true}

      # PostgreSQL configuration (for Dagster storage)
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagster}
      POSTGRES_HOST: dagster-postgresql
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
      POSTGRES_PORT: 5432
    volumes:
      # Bind mount for artifacts directory (shared with webserver)
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      dagster-postgresql:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy

# Persistent volumes
volumes:
  dagster-postgresql-data:
    driver: local
