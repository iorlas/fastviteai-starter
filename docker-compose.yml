  # Temporal Services (for URL processing pipeline)
  temporal-postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432" # Different port to avoid conflict with main postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233" # Temporal gRPC endpoint
    environment:
      - BIND_ON_IP=0.0.0.0
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 7233 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    ports:
      - "8080:8080" # Temporal Web UI
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - PROJECT_ROOT=/app
      - DAGSTER_HOME=/app/.dagster
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts # Share artifacts directory
      - ./manual_links.txt:/app/manual_links.txt:ro # Mount input files (read-only)
      - ./monitoring_list.txt:/app/monitoring_list.txt:ro
    user: "1000:1000" # Match the appuser UID/GID from Dockerfile
    restart: unless-stopped

# Persistent volume for PostgreSQL data
volumes:
  postgres-data:
    driver: local
  temporal-postgres-data:
    driver: local
