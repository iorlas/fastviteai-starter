# Prompt Optimization Experiments
# Goal: Reduce prompt size while maintaining 100% insight coverage

variations:
  # BASELINE: Current prompt (for comparison)
  v0_baseline:
    name: "Baseline (Current)"
    system_prompt: |
      Extract information from content into structured JSON for programmatic processing.

      Focus on:
      - What's the ONE-SENTENCE answer to the article title?
      - What's UNIQUE or NOVEL here (vs typical articles on this topic)?
      - How do concepts CONNECT (visual relationships)?
      - What aids MEMORY (sticky phrases, metaphors)?

      CRITICAL: Capture ALL details, including:
      - Full context around quotes (who said it, when, why - not just the quote)
      - Exact numbers and team sizes (e.g., "4 people" not just "small teams")
      - Supporting examples with specific details and numbers
      - Forward-looking statements (future posts, upcoming work, tooling plans)
      - Exact formulas and quantitative data
      - Historical comparisons and lessons learned (e.g., how SOA failed, what went wrong with predecessors)
      - Cautionary tales and warnings about pitfalls
      - Contrarian examples that illustrate principles

    user_template: |
      Extract structured information from this {content_type}:

      Title: {title}

      Content:
      {content}

      Provide comprehensive extraction covering:
      - Core answer (one sentence directly answering the title)
      - Unique insights (novel/contrarian views, standout data)
      - Classification (topics, content type, depth level)
      - Core insights (with memory aids, supporting facts, quantitative data, connections)
      - Knowledge graph ASCII (visual relationships with arrows and hierarchies)
      - Entities (people with full quote context, organizations, concepts, formulas with exact numbers, examples with specific details)
      - Forward-looking statements (future posts, planned content)
      - Memory aids (key phrases with full context, visual metaphors, mnemonics)

  # V1: CONDENSED - Remove redundancy, keep all instructions
  v1_condensed:
    name: "Condensed (No Redundancy)"
    system_prompt: |
      Extract ALL information from content into structured JSON.

      Critical requirements:
      - Capture exact numbers, formulas, team sizes (e.g., "4 people" not "small teams")
      - Include full quote context (who, when, why)
      - Extract supporting examples with specific details
      - Identify novel/contrarian insights vs typical viewpoints
      - Note forward-looking statements (future posts, upcoming work)
      - Record historical comparisons and lessons learned
      - Capture warnings, pitfalls, cautionary tales

    user_template: |
      Title: {title}

      Content:
      {content}

      Extract everything following the schema: core answer, unique insights, classification, detailed core insights with memory aids and connections, knowledge graph, entities (people/orgs/concepts/formulas/examples), forward-looking statements, memory aids.

  # V2: PRINCIPLE-BASED - Core principles instead of exhaustive lists
  v2_principle:
    name: "Principle-Based (Core Rules)"
    system_prompt: |
      Extract comprehensive structured information following these principles:

      1. SPECIFICITY: Always include exact numbers, formulas, quotes with full attribution
      2. COMPLETENESS: Extract every detail - main arguments AND supporting evidence
      3. CONTEXT: Preserve who/when/why around all claims and quotes
      4. FORWARD-LOOKING: Capture future plans, upcoming posts, tooling mentions

    user_template: |
      Title: {title}
      Content:
      {content}

      Apply extraction principles to produce structured output per schema.

  # V3: SCHEMA-DRIVEN - Let Pydantic schema do the work
  v3_minimal:
    name: "Minimal (Schema-Driven)"
    system_prompt: |
      Extract ALL information from the content into the structured schema.

      Critical: Include exact numbers, full quote context (who/when/why), specific examples with details, and forward-looking statements.

    user_template: |
      Title: {title}
      Content:
      {content}

  # V4: ANTI-LOSS - Focus on what models typically miss
  v4_antiloss:
    name: "Anti-Loss (Target Weak Points)"
    system_prompt: |
      Extract information into structured JSON, paying special attention to commonly missed details:

      MUST capture:
      - Direct quotes with FULL context (speaker name, situation, exact quote)
      - Specific numbers and formulas (exact values, what they measure)
      - Supporting examples and anecdotes (with specific details, not generic descriptions)
      - Future plans and forward-looking statements
      - Historical comparisons and what went wrong
      - Contrarian or novel viewpoints vs conventional wisdom

    user_template: |
      Title: {title}
      Content:
      {content}

      Extract per schema, ensuring no quotes, numbers, examples, or forward-looking statements are missed.

  # V5: HYBRID - Best of condensed + anti-loss
  v5_hybrid:
    name: "Hybrid (Optimized Best)"
    system_prompt: |
      Extract ALL information comprehensively. Focus on completeness and specificity.

      Never skip:
      - Quotes: Include speaker, context, exact words
      - Numbers: Exact values, formulas, what they measure
      - Examples: Specific details, not summaries
      - Future references: Upcoming posts, planned work, tooling
      - Novel insights: Contrarian views, unexpected data

    user_template: |
      Title: {title}
      Content:
      {content}

      Extract everything per schema structure.

  # V1.1: REFINED CONDENSED - V1 + cross-content synthesis
  v1_1_refined:
    name: "Condensed v1.1 (Synthesis Fix)"
    system_prompt: |
      Extract ALL information from content into structured JSON.

      Critical requirements:
      - Capture exact numbers, formulas, team sizes (e.g., "4 people" not "small teams")
      - Connect related details scattered across content (e.g., rule + its numeric limit)
      - Include full quote context (who, when, why)
      - Extract supporting examples with specific details
      - Identify novel/contrarian insights vs typical viewpoints
      - Note forward-looking statements (future posts, upcoming work)
      - Record historical comparisons and lessons learned
      - Capture warnings, pitfalls, cautionary tales

    user_template: |
      Title: {title}

      Content:
      {content}

      Extract everything following the schema: core answer, unique insights, classification, detailed core insights with memory aids and connections, knowledge graph, entities (people/orgs/concepts/formulas/examples), forward-looking statements, memory aids.
