[project]
name = "ailabbrains"
version = "2.0.0"
description = "Content extraction and summarization pipeline using LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "structlog>=23.0.0",
    "pydantic>=2.12.2",
    "beautifulsoup4>=4.14.2",
    "yt-dlp>=2025.10.22",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
    "youtube-transcript-api>=1.2.3",
    "faster-whisper>=1.1.0",
    "pysocks>=1.7.1",
    "trafilatura>=2.0.0",
    "hishel>=0.0.30",
    "anysqlite>=0.0.5",
    "pydantic-settings>=2.11.0",
    "tiktoken>=0.12.0",
    "socksio>=1.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
ailabbrains = "ailabbrains.cli:app"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=37.11.0",
    "playwright>=1.55.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 140
exclude = ["experiments/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ty.environment]
python-version = "3.12"
python = "./.venv"

[tool.ty.src]
include = ["ailabbrains"]

[tool.ty.rules]
# Core type safety - error
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
missing-argument = "error"
unsupported-operator = "error"
division-by-zero = "error"

# Code quality - warn
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = "."
markers = [
    "contract: marks tests as contract tests (external API verification)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
